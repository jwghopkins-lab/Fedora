name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (whitelist only)
        run: python3 pipeline/deploy_pages.py --out _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the DEPLOYED url, not the local build
        run: |
          sleep 10
          curl -sSf "${{ steps.deployment.outputs.page_url }}" -o /dev/null
          echo "live: ${{ steps.deployment.outputs.page_url }}"
