<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FEDORA — quest</title>
<!-- user-scalable removed: players need to pinch-zoom small cast lettering,
     and the inputs are already 16px so iOS never auto-zooms on focus -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #F5F3EE; --panel: #FFFFFF; --ink: #241F19; --ink-soft: #6B6155;
    --line: #D3CCC0; --accent: #8A5518; --accent-soft: #F0E2CC;
    --accent-ink: #FFFFFF;                       /* text ON accent */
    --wrong: #B4291B; --wrong-soft: #F7DAD5; --good: #1E7B4F; --good-soft: #DDEEE4;
    --k-wits: #3C5F8A; --k-wits-soft: #E1E8F2;
    --k-dig: #3F6B44; --k-dig-soft: #E0EDE1;
    --k-ground: #8A5518; --k-ground-soft: #F5E4CE;
    --key: #E8E4DB; --key-ink: #241F19; --shadow: 0 1px 3px rgba(30,25,20,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171412; --panel: #211D19; --ink: #EDE7DE; --ink-soft: #A29786;
      --line: #443D34; --accent: #E0A65E; --accent-soft: #3D2F1C;
      --accent-ink: #1A1512;                     /* dark ink on light brass */
      --wrong: #F08877; --wrong-soft: #4A2622; --good: #63CD97; --good-soft: #1E3A2C;
      --k-wits: #8FB2DE; --k-wits-soft: #24303F;
      --k-dig: #8FC796; --k-dig-soft: #1F3222;
      --k-ground: #E0A65E; --k-ground-soft: #3D2F1C;
      --key: #322C25; --key-ink: #EDE7DE; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  .screen { width: 100%; max-width: 560px; display: none; flex-direction: column;
            min-height: 100dvh; padding: 8px 12px calc(20px + env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  header { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; }
  .wordmark { font-family: Georgia, "Times New Roman", serif; font-weight: 700;
              font-size: 1.45rem; letter-spacing: .1em; }
  .wordmark span { color: var(--accent); }
  .tagline { font-size: .68rem; color: var(--ink-soft); letter-spacing: .08em; text-transform: uppercase; }
  .spacer { flex: 1; }
  #teamtag { font-size: .78rem; color: var(--ink-soft); text-align: right; max-width: 40%;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner { background: var(--wrong-soft); color: var(--wrong); border-radius: 8px;
            font-size: .74rem; padding: 7px 10px; margin: 6px 0; }
  .card2 { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 16px 14px; margin: 10px 0; box-shadow: var(--shadow); }
  .card2 h2 { font-family: Georgia, serif; font-size: 1.15rem; margin-bottom: 8px; }
  .card2 p { font-size: .84rem; color: var(--ink-soft); line-height: 1.45; margin-bottom: 8px; }
  input[type=text] { width: 100%; padding: 12px; font-size: 1rem; border-radius: 9px;
                     border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .btn { border: none; border-radius: 10px; padding: 13px 0; font-size: .95rem;
         font-weight: 600; cursor: pointer; width: 100%; min-height: 44px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: var(--key); color: var(--key-ink); }
  .err { color: var(--wrong); font-size: .8rem; margin-top: 8px; min-height: 1.1em; }

  #progress { display: flex; align-items: center; gap: 10px; padding: 4px 2px 2px; }
  #progressbar { flex: 1; height: 8px; border-radius: 999px; background: var(--key); overflow: hidden; }
  #progressfill { height: 100%; width: 0; background: var(--accent); border-radius: 999px;
                  transition: width .4s ease; }
  #progresstext { font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .strikeline { font-size: .74rem; color: var(--ink-soft); padding: 0 2px 6px; }
  .strikeline b.out { color: var(--wrong); }

  #journey { flex: 1; }
  .part { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .part.intro { border-style: dashed; border-color: var(--accent); }
  .part.done { border-color: var(--good); }
  .part.skipped { border-color: var(--ink-soft); }
  .part.sealed { opacity: .5; }
  .phead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
           font-size: .72rem; font-weight: 700; letter-spacing: .06em;
           text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  .phead .no { color: var(--accent); }
  .phead .state { margin-left: auto; }
  .pill { font-size: .62rem; font-weight: 800; letter-spacing: .1em; padding: 3px 8px;
          border-radius: 999px; white-space: nowrap; }
  .pill.wits   { background: var(--k-wits-soft);   color: var(--k-wits); }
  .pill.dig    { background: var(--k-dig-soft);    color: var(--k-dig); }
  .pill.ground { background: var(--k-ground);      color: var(--accent-ink); }
  .ptext { font-family: Georgia, serif; font-size: 1rem; line-height: 1.55;
           white-space: pre-line; }   /* clue text carries real line breaks */
  .ptext .caret { opacity: .55; font-family: system-ui, sans-serif; }
  .pans { margin-top: 12px; display: flex; gap: 8px; }
  .pans input { flex: 1; padding: 12px; font-size: 1.05rem; border-radius: 9px;
                border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
                min-height: 44px; }
  .pans input:focus-visible { outline: 2px solid var(--accent); }
  .pans .btn { width: 108px; flex: none; padding: 11px 0; }
  .prow2 { margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .hintbtn { border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
             font-size: .72rem; padding: 8px 12px; border-radius: 999px; cursor: pointer;
             min-height: 36px; font-variant-numeric: tabular-nums; }
  .hintbtn:disabled { opacity: .55; cursor: default; }
  .hinttext { margin-top: 10px; padding: 10px 12px; border-radius: 10px;
              background: var(--accent-soft); color: var(--ink); font-size: .86rem;
              line-height: 1.45; }
  .skipbtn { border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
             font-size: .72rem; padding: 8px 12px; border-radius: 999px; cursor: pointer;
             min-height: 36px; }
  .done .answer { font-family: ui-monospace, Menlo, monospace; font-size: 1.05rem;
                  letter-spacing: .08em; color: var(--good); font-weight: 700; margin-top: 8px; }
  .skipped .answer { color: var(--ink-soft); }
  .part.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .kindkey { font-size: .78rem; color: var(--ink-soft); line-height: 1.5; margin-top: 10px; }
  .kindkey div { margin: 6px 0; }
  .toolrow { display: flex; gap: 6px; justify-content: center; padding: 10px 0 2px; }
  .tool { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
          font-size: .76rem; padding: 11px 16px; border-radius: 999px; cursor: pointer;
          min-height: 44px; }
  .tool:focus-visible, .btn:focus-visible, .skipbtn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  #modal { position: fixed; inset: 0; background: rgba(14,12,10,.55); display: none;
           align-items: center; justify-content: center; padding: 18px; z-index: 20; }
  #modal.show { display: flex; }
  .card { background: var(--panel); color: var(--ink); border-radius: 16px; padding: 22px 20px;
          max-width: 380px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.35);
          max-height: 86dvh; overflow-y: auto; }
  .card h2 { font-family: Georgia, serif; font-size: 1.35rem; margin-bottom: 6px; }
  .card .sub { color: var(--ink-soft); font-size: .82rem; margin-bottom: 10px; line-height: 1.45; }
  .lb { margin-top: 8px; font-size: .86rem; }
  .lbrow { display: flex; gap: 8px; padding: 4px 0; align-items: baseline;
           font-variant-numeric: tabular-nums; }
  .lbrow.me { color: var(--accent); font-weight: 700; }
  .lbrow .n { width: 2em; color: var(--ink-soft); }
  .lbrow .s { margin-left: auto; font-family: ui-monospace, Menlo, monospace; }
  .btnrow { display: flex; gap: 8px; margin-top: 14px; }
  .btnrow .btn { flex: 1; padding: 12px 0; font-size: .9rem; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: var(--ink); color: var(--paper); font-size: .82rem; padding: 10px 16px;
           border-radius: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
           z-index: 30; width: calc(100% - 32px); max-width: 420px; text-align: center;
           line-height: 1.35; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="screen on" id="s-join">
  <header><div><div class="wordmark">FED<span>O</span>RA</div>
    <div class="tagline">the city is the board</div></div></header>
  <div id="offline-banner" class="banner" style="display:none">
    No backend configured — this build can't check answers.</div>
  <div class="card2">
    <h2>Enter your team code</h2>
    <p>One code per team — any number of phones can share it, and progress is
       shared live. The questions lead somewhere real: this cannot be finished
       from a sofa.</p>
    <input type="text" id="codein" maxlength="40" placeholder="TEAM CODE"
           autocomplete="off" autocapitalize="characters" autocorrect="off"
           spellcheck="false" enterkeyhint="go" aria-label="Team code">
    <div class="err" id="joinerr" role="alert" aria-live="assertive"></div>
    <button class="btn primary" id="joinbtn" disabled>Join the hunt</button>
  </div>
</div>

<div class="screen" id="s-quest">
  <header>
    <div><div class="wordmark">FED<span>O</span>RA</div>
      <div class="tagline" id="hunttitle"></div></div>
    <div class="spacer"></div>
    <div id="teamtag"></div>
  </header>
  <div id="progress">
    <div id="progressbar"><div id="progressfill"></div></div>
    <div id="progresstext"></div>
  </div>
  <div class="strikeline" id="strikeline" aria-live="polite"></div>
  <div id="journey"></div>
  <div class="toolrow">
    <button class="tool" id="lbbtn">Leaderboard</button>
    <button class="tool" id="refreshbtn">↻ Sync</button>
  </div>
</div>

<div id="modal"><div class="card" id="modalcard"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const CFG = window.FEDORA_CONFIG || {};
const ONLINE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
const LS = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem("fedoraq." + k)) ?? d; }
                   catch { return d; } },
  set: (k, v) => { try { localStorage.setItem("fedoraq." + k, JSON.stringify(v)); }
                   catch {} },
  del: (k) => { try { localStorage.removeItem("fedoraq." + k); } catch {} },
};
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const KIND_LABEL = { wits: "Wits", dig: "The Dig", ground: "Ground Truth" };

let CODE = null, TEAM = null, HUNT = null, INTRO = null, NCLUES = 0;
let STARTED = true, STARTS_AT = null;
let STRIKES = 0, STRIKE_LIMIT = null, ELIGIBLE = true;
let HINT_WAIT_MS = 5 * 60 * 1000;   // replaced by the server's hunts.hint_wait_s
let SOLVED = {};       // idx -> {answer, at, skipped}
let UNLOCKED = {};     // idx -> {qtype, kind, clue_text}
let inflight = 0;      // >0 while a submit/skip is outstanding
let stateGen = 0;      // monotonic: a stale sync response must never win
let pollInt = null;
const typing = new Map();   // idx -> interval id, for in-progress reveals

function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => $("toast").classList.remove("show"), 3200);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// every network call gets a deadline: a hung fetch outdoors is indistinguishable
// from a dead app, and a lost response used to look like an unsolved clue
async function rpc(fn, args, ms = 12000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const res = await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json", apikey: CFG.SUPABASE_ANON_KEY,
                 Authorization: `Bearer ${CFG.SUPABASE_ANON_KEY}` },
      body: JSON.stringify(args),
    });
    if (!res.ok) { const e = new Error(`HTTP ${res.status}`); e.http = res.status; throw e; }
    return res.json();
  } finally { clearTimeout(t); }
}
function netMsg(err) {
  if (err && err.name === "AbortError") return "That took too long — tap Submit again.";
  if (err && err.http === 429) return "Too many requests — wait a moment.";
  if (err && err.http >= 500) return "The server is having a moment. Try again.";
  return "No signal — try again.";
}

function applyState(r) {
  SOLVED = {};
  for (const s of r.solved || [])
    SOLVED[s.idx] = { answer: s.answer, at: s.solved_at, skipped: !!s.skipped };
  UNLOCKED = {};
  for (const u of r.unlocked || [])
    UNLOCKED[u.idx] = { qtype: u.qtype, kind: u.kind || "ground", clue_text: u.clue_text,
                        has_hint: !!u.has_hint, since: u.since, hint_taken: !!u.hint_taken };
  STARTED = r.started !== false;
  STARTS_AT = r.starts_at;
  STRIKES = r.strikes || 0; STRIKE_LIMIT = r.strike_limit ?? null;
  ELIGIBLE = r.eligible !== false;
  if (Number.isFinite(r.hint_wait_s)) HINT_WAIT_MS = r.hint_wait_s * 1000;
  if (r.intro !== undefined && r.intro !== null) INTRO = r.intro;
  if (r.n_clues) NCLUES = r.n_clues;
}
// fingerprint: lets sync() skip a pointless DOM rebuild, which is what used to
// slam the keyboard shut and restart the typewriter every 30 seconds
function fingerprint() {
  return [STARTED, STRIKES, STRIKE_LIMIT, ELIGIBLE, NCLUES,
          Object.keys(SOLVED).sort().join(","),
          Object.values(SOLVED).map((s) => s.answer).join("|"),
          Object.keys(UNLOCKED).sort().join(","),
          // the fields too, not just the keys: a teammate taking a hint on
          // another phone changes nothing about WHICH clues are open, and a
          // keys-only fingerprint would suppress the re-render that shows it
          Object.keys(UNLOCKED).sort().map((i) =>
            `${UNLOCKED[i].kind}${UNLOCKED[i].has_hint ? "H" : ""}` +
            `${UNLOCKED[i].hint_taken ? "T" : ""}`).join("|")].join("~");
}
let lastPrint = null;

/* ---- typewriter: first view of a clue only, tap to skip ---- */
function seenSet() { return new Set(LS.get("seen." + HUNT, [])); }
function markSeen(idx) {
  const s = seenSet(); s.add(idx); LS.set("seen." + HUNT, [...s]);
}
function typeInto(el, text, idx) {
  const total = text.length;
  const step = Math.max(8, Math.min(22, Math.floor(3200 / Math.max(1, total))));
  let i = 0;
  el.textContent = "";
  const finish = () => {
    clearInterval(typing.get(idx)); typing.delete(idx);
    el.textContent = text; markSeen(idx);
  };
  const id = setInterval(() => {
    i += 2;
    if (i >= total) { finish(); return; }
    el.textContent = text.slice(0, i);
  }, step);
  typing.set(idx, id);
  return finish;
}

function render() {
  lastPrint = fingerprint();
  const nDone = Object.keys(SOLVED).length;
  $("progressfill").style.width = NCLUES ? (100 * nDone / NCLUES) + "%" : "0";
  $("progresstext").textContent = `${nDone}/${NCLUES}`;
  $("strikeline").innerHTML = STRIKE_LIMIT == null ? "" : ELIGIBLE
    ? `Wrong answers: <b>${STRIKES}/${STRIKE_LIMIT}</b> — go over and you can
       finish, but you can't win.`
    : `<b class="out">Out of the running</b> — too many wrong answers. Finish
       for glory, not the crown.`;

  const j = $("journey");
  j.innerHTML = "";
  if (!STARTED) {
    const w = document.createElement("div");
    w.className = "part intro";
    w.innerHTML = `<div class="ptext">The hunt has not started${STARTS_AT
      ? " — first light at " + escapeHtml(new Date(STARTS_AT).toLocaleString()) : ""}.</div>`;
    j.appendChild(w);
    return;
  }
  if (INTRO) {
    const w = document.createElement("div");
    w.className = "part intro";
    w.innerHTML = `<div class="phead"><span class="no">Your brief</span></div>
      <div class="ptext">${escapeHtml(INTRO)}</div>
      <div class="kindkey">
        <div><span class="pill wits">WITS</span> &nbsp;think — no phone, no walking</div>
        <div><span class="pill dig">THE DIG</span> &nbsp;it's in the record — go and look it up</div>
        <div><span class="pill ground">GROUND TRUTH</span> &nbsp;only the city knows — be there</div>
      </div>`;
    j.appendChild(w);
  }
  for (let i = 1; i <= NCLUES; i++) {
    const div = document.createElement("div");
    div.dataset.idx = i;
    const sv = SOLVED[i];
    if (sv) {
      div.className = "part " + (sv.skipped ? "skipped" : "done");
      div.innerHTML = `<div class="phead"><span class="no">Part ${i}</span>
        <span class="state">${sv.skipped ? "skipped" : "✓"}</span></div>
        <div class="answer">${escapeHtml(sv.answer || "")}</div>`;
    } else if (UNLOCKED[i]) {
      const u = UNLOCKED[i];
      const kind = KIND_LABEL[u.kind] ? u.kind : "ground";
      div.className = "part open";
      const attrs = u.qtype === "number"
        ? 'inputmode="numeric" pattern="[0-9]*" placeholder="a whole number" ' +
          'autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="off"'
        : 'placeholder="your answer" autocapitalize="characters" autocorrect="off" ' +
          'spellcheck="false" autocomplete="off"';
      div.innerHTML =
        `<div class="phead"><span class="no">Part ${i}</span>
           <span class="pill ${kind}">${KIND_LABEL[kind].toUpperCase()}</span></div>
         <div class="ptext"></div>
         <div class="pans">
           <input type="text" maxlength="40" ${attrs} enterkeyhint="send"
                  aria-label="Answer to part ${i}">
           <button class="btn primary">Submit</button>
         </div>
         <div class="prow2">
           <button class="hintbtn" hidden></button>
           <button class="skipbtn">Can't get this one →</button>
         </div>
         <div class="hinttext" hidden></div>`;
      const textEl = div.querySelector(".ptext");
      const inp = div.querySelector("input");
      const btn = div.querySelector(".btn");
      if (REDUCED || seenSet().has(i)) {
        textEl.textContent = u.clue_text;
      } else {
        const finish = typeInto(textEl, u.clue_text, i);
        div.addEventListener("click", (ev) => {
          if (typing.has(i) && ev.target !== inp) finish();
        }, { once: false });
      }
      btn.onclick = () => submit(i, inp, btn, div);
      inp.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); submit(i, inp, btn, div); }
      });
      div.querySelector(".skipbtn").onclick = () => confirmSkip(i);
      wireHint(div, i, u);
    } else {
      div.className = "part sealed";
      div.innerHTML = `<div class="phead"><span class="no">Part ${i}</span>
        <span class="state">🔒</span></div>
        <div class="ptext" style="font-size:.8rem;color:var(--ink-soft)">
        Sealed until the part before it falls.</div>`;
    }
    j.appendChild(div);
  }
}

// Hints unlock hint_wait_s after the clue does. The server is the authority;
// this only decides what the button says, and ticks so the wait is visible.
const hintShown = new Map();     // idx -> hint text, once taken this session
function wireHint(div, idx, u) {
  const btn = div.querySelector(".hintbtn");
  const out = div.querySelector(".hinttext");
  if (!btn || !u.has_hint) return;
  btn.hidden = false;
  const already = hintShown.get(idx);
  if (already) {
    btn.hidden = true;
    out.hidden = false; out.textContent = "Hint: " + already;
    return;
  }
  if (u.hint_taken) {
    // the hint text is deliberately absent from the state payload, so after a
    // reload we have to ask for it again — fedora_hint is idempotent, so this
    // re-reads the hint the team already paid for without charging twice
    btn.textContent = "Show the hint you took";
    btn.disabled = false;
    btn.onclick = () => takeHint(idx, btn, out, true);
    return;
  }
  // `first` matters: wireHint runs while the card is still detached (render()
  // appends it afterwards), so a containment check on tick 1 would kill the
  // countdown before it started and leave the button blank forever.
  const tick = (first) => {
    if (!first && !btn.isConnected) return;
    const since = u.since ? new Date(u.since).getTime() : Date.now();
    const left = HINT_WAIT_MS - (Date.now() - since);
    if (left > 0) {
      btn.disabled = true;
      const m = Math.floor(left / 60000), sec = Math.floor((left % 60000) / 1000);
      btn.textContent = `Hint in ${m}:${String(sec).padStart(2, "0")}`;
      setTimeout(() => tick(false), Math.min(1000, left));
    } else {
      btn.disabled = false;
      btn.textContent = "Take a hint (counts against you)";
    }
  };
  tick(true);
  btn.onclick = () => takeHint(idx, btn, out, false);
}

async function takeHint(idx, btn, out, again) {
  btn.disabled = true;
  try {
    const r = await rpc("fedora_hint", { p_code: CODE, p_idx: idx });
    if (r.status === "ok") {
      hintShown.set(idx, r.hint);
      btn.hidden = true;
      out.hidden = false; out.textContent = "Hint: " + r.hint;
      if (UNLOCKED[idx]) UNLOCKED[idx].hint_taken = true;
      if (!again) toast("Hint taken — it's on your record.");
    } else if (r.status === "too_soon") {
      const m = Math.floor(r.wait_s / 60), sec = r.wait_s % 60;
      toast(`Not yet — ${m}:${String(sec).padStart(2, "0")} to go.`);
      btn.disabled = false;
    } else { toast("Hmm: " + r.status); btn.disabled = false; }
  } catch (err) { toast(netMsg(err)); btn.disabled = false; }
}

async function submit(idx, inp, btn, div) {
  const raw = inp.value.trim();
  if (!raw) { toast("Type an answer first"); return; }
  if (btn.disabled) return;                 // double-tap / Enter+tap guard
  btn.disabled = true; inflight++;
  try {
    const r = await rpc("fedora_submit", { p_code: CODE, p_idx: idx, p_guess: raw });
    if (r.status === "correct") {
      SOLVED[idx] = { answer: r.answer, at: Date.now(), skipped: false };
      delete UNLOCKED[idx];
      for (const u of r.newly_unlocked || [])
        UNLOCKED[u.idx] = { qtype: u.qtype, kind: u.kind || "ground", clue_text: u.clue_text,
                            has_hint: !!u.has_hint, since: u.since, hint_taken: !!u.hint_taken };
      render();
      if (Object.keys(SOLVED).length === NCLUES) showWin();
      else {
        toast(`✓ Part ${idx} down`);
        const next = document.querySelector(".part.open");
        if (next) next.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" });
      }
    } else if (r.status === "wrong") {
      const wasEligible = ELIGIBLE;
      if (r.strike_limit != null) {
        STRIKES = r.strikes; STRIKE_LIMIT = r.strike_limit; ELIGIBLE = r.eligible;
      }
      render();
      const card = document.querySelector(`.part[data-idx="${idx}"]`);
      if (card) {
        const again = card.querySelector("input");
        if (again) again.value = raw;
        void card.offsetWidth; card.classList.add("shake");
      }
      toast(wasEligible && !ELIGIBLE
        ? "Wrong — and that was one too many. You're out of the running."
        : "The square disagrees. Look again.");
    } else if (r.status === "ambiguous") {
      toast("Two numbers in there — give one whole number.");
    } else if (r.status === "cooldown") {
      toast(`Steady on — try again in ${r.retry_in}s`);
    } else if (r.status === "empty") {
      toast("Numbers only for this one");
    } else if (r.status === "already_solved") {
      await refresh();
    } else if (r.status === "not_started") {
      toast("The hunt hasn't started yet");
    } else {
      toast("Hmm: " + r.status);
    }
  } catch (err) {
    toast(netMsg(err));
    // the answer may have landed: reconcile rather than leave a phantom
    setTimeout(refresh, 1200);
  } finally {
    inflight--; btn.disabled = false;
  }
}

function confirmSkip(idx) {
  $("modalcard").innerHTML = `<h2>Leave this one behind?</h2>
    <div class="sub">It stays unanswered and you can't win on it — but the rest of
    the hunt unlocks, so a wall or a locked gate can't end your day. We log which
    question beat you, which is genuinely useful to us.</div>
    <div class="btnrow">
      <button class="btn ghost" id="skno">Keep trying</button>
      <button class="btn primary" id="skyes">Move on</button>
    </div>`;
  $("modal").classList.add("show");
  $("skno").onclick = () => $("modal").classList.remove("show");
  $("skyes").onclick = async () => {
    $("modal").classList.remove("show");
    inflight++;
    try {
      const r = await rpc("fedora_skip", { p_code: CODE, p_idx: idx, p_note: "SKIPPED" });
      if (r.status === "skipped") {
        SOLVED[idx] = { answer: "— skipped —", at: Date.now(), skipped: true };
        delete UNLOCKED[idx];
        for (const u of r.newly_unlocked || [])
          UNLOCKED[u.idx] = { qtype: u.qtype, kind: u.kind || "ground", clue_text: u.clue_text,
                              has_hint: !!u.has_hint, since: u.since, hint_taken: !!u.hint_taken };
        render();
        toast("Moved on. The next part is open.");
      } else { toast("Hmm: " + r.status); }
    } catch (err) { toast(netMsg(err)); }
    finally { inflight--; }
  };
}

async function refresh(force) {
  if (!CODE) return;
  if (inflight > 0 && !force) return;
  const gen = ++stateGen;
  try {
    const r = await rpc("fedora_join", { p_code: CODE });
    // a slow response must never overwrite newer local truth
    if (gen !== stateGen || inflight > 0 || r.status !== "ok") return;
    applyState(r);
    if (fingerprint() !== lastPrint) render();
    if (NCLUES && Object.keys(SOLVED).length === NCLUES) showWin();
  } catch {}
}

async function join(code) {
  const r = await rpc("fedora_join", { p_code: code });
  if (r.status !== "ok") {
    if (r.status === "bad_code") LS.del("code");
    $("joinerr").textContent = r.status === "bad_code"
      ? "That code opens no doors. Check it with your quartermaster."
      : "Hunt unavailable: " + r.status;
    return false;
  }
  if (CFG.QUEST_HUNT_ID && r.hunt_id !== CFG.QUEST_HUNT_ID) {
    LS.del("code");
    $("joinerr").textContent = "That code belongs to a different hunt.";
    return false;
  }
  CODE = code; TEAM = r.team_name; HUNT = r.hunt_id;
  LS.set("code", code);
  applyState(r);
  $("hunttitle").textContent = r.title || "";
  $("teamtag").textContent = r.team_name;
  $("s-join").classList.remove("on");
  $("s-quest").classList.add("on");
  render();
  clearInterval(pollInt);
  pollInt = setInterval(refresh, 30000);
  if (NCLUES && Object.keys(SOLVED).length === NCLUES) showWin();
  return true;
}

async function showBoard() {
  let rows = [];
  try { rows = await rpc("fedora_leaderboard", { p_hunt: HUNT }); }
  catch (err) { toast(netMsg(err)); return; }
  const lb = rows.map((t, i) =>
    `<div class="lbrow${t.team_name === TEAM ? " me" : ""}"` +
    `${t.eligible === false ? ' style="opacity:.55"' : ""}>` +
    `<span class="n">${i + 1}.</span><span>${escapeHtml(t.team_name)}` +
    `${t.eligible === false ? " ✕" : ""}</span>` +
    `<span class="s">${t.solved}/${NCLUES}` +
    `${t.skipped ? ` · ${t.skipped} skipped` : ""}` +
    `${t.hints ? ` · ${t.hints} hint${t.hints > 1 ? "s" : ""}` : ""}</span></div>`
  ).join("");
  $("modalcard").innerHTML = `<h2>Standings</h2>
    <div class="sub">Parts cracked per team. ✕ = out of the running.</div>
    <div class="lb">${lb || "No teams yet."}</div>
    <div class="btnrow"><button class="btn ghost" id="mclose">Close</button></div>`;
  $("modal").classList.add("show");
  $("mclose").onclick = () => $("modal").classList.remove("show");
}
let winShown = false;
function showWin() {
  if (winShown) return;
  winShown = true;
  clearInterval(pollInt);
  const skipped = Object.values(SOLVED).filter((s) => s.skipped).length;
  $("modalcard").innerHTML = `<h2>The square has given up its numbers.</h2>
    <div class="sub">Every part logged${skipped ? `, ${skipped} left behind` : ""}.
    Compare notes with the other agents — where your counts agree, the city has
    spoken. Where they don't, we have found a question that needs rewriting.</div>
    <div class="btnrow">
      <button class="btn ghost" id="mboard">Standings</button>
      <button class="btn primary" id="mclose2">Done</button>
    </div>`;
  $("modal").classList.add("show");
  $("mboard").onclick = () => { $("modal").classList.remove("show"); showBoard(); };
  $("mclose2").onclick = () => $("modal").classList.remove("show");
}

$("lbbtn").onclick = showBoard;
$("refreshbtn").onclick = async () => {
  await refresh(true);
  toast("Synced");
};
$("codein").oninput = () => { $("joinbtn").disabled = !$("codein").value.trim(); };
$("codein").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && $("codein").value.trim()) { ev.preventDefault(); $("joinbtn").click(); }
});
$("joinbtn").onclick = async () => {
  $("joinbtn").disabled = true;
  $("joinerr").textContent = "";
  try { if (!(await join($("codein").value.trim().toUpperCase()))) $("joinbtn").disabled = false; }
  catch (err) { $("joinerr").textContent = netMsg(err); $("joinbtn").disabled = false; }
};
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && CODE) refresh();
});

(async () => {
  if (!ONLINE) { $("offline-banner").style.display = "block"; return; }
  const saved = LS.get("code", null);
  if (saved) {
    try { await join(saved); }
    catch (err) { $("joinerr").textContent = netMsg(err); }
  }
})();
</script>
</body>
</html>
